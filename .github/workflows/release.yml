name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # for trusted publishing to PyPI

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # Drop --zig and rely on `manylinux: auto`. With --zig, maturin
          # cross-links on the host and needs an aarch64-targeted Python on
          # PATH (which there isn't), causing the aarch64 build to fail with
          # "Couldn't find any python interpreters". `manylinux: auto` runs
          # the build inside the official manylinux<arch> container.
          # Pin --interpreter explicitly to 3.9–3.13: `--find-interpreter`
          # would also pick up Python 3.14 (now shipping in the manylinux
          # image) and pyo3 0.24.2 only supports up to 3.13. Bumping pyo3
          # to >=0.25 to add 3.14 support is a separate follow-up.
          args: --release --out dist --interpreter python3.9 python3.10 python3.11 python3.12 python3.13
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    # macos-latest is Apple Silicon (arm64). Phase 4 cross-cutting decision:
    # drop the macos-13 (x86) runner family-wide due to 24-hour queue hangs.
    # Intel-mac users fall back to source builds.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    # Tied to the `pypi` GitHub Actions environment — must match the
    # "Environment name" in PyPI's trusted-publisher config for `l1tv`.
    # Required reviewers / branch rules configured at the env level act as
    # the gate before this job mints an OIDC token and uploads.
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
